name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run release tests
        run: python -m unittest discover -s tests -v
      - name: Verify exported results
        run: python scripts/export_results.py --check
